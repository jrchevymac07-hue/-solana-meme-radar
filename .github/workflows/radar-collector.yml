name: Meme Radar Collector

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger protected radar collection
        env:
          CRON_SECRET: ${{ secrets.MEME_RADAR_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "MEME_RADAR_CRON_SECRET is not configured."
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://memeradar-wheat.vercel.app/api/cron/collect
